version: 2
updates:
  # Enable version updates for npm
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
      "-scope": ""
    ignore-rules:
      # Ignore updates for packages that are not in package.json
      - "dependencies"
    # Do not automatically merge dependency updates
    automerge: false
    # Only update locked deps
    directory-updates: true
    # Showtypr: prefer-prs